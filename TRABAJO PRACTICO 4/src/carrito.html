<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planta tu sueño - Carrito</title>

    <link rel="stylesheet" href="recursos/css/estilos.css">
</head>

<body>

    <header class="cabecera-principal">

        <h1>PLANTA TU SUEÑO</h1>

        <img class="logo"
             src="recursos/img/logo.png"
             alt="Logo de Planta tu sueño">

        <nav aria-label="Menú principal">

            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="menu-icon">☰</label>

            <div class="menu">

                <a href="index.html">Inicio</a>

                <a href="catalogo.html">Catálogo</a>

                <a href="nosotros.html">Nosotros</a>

            </div>

            <a class="carrito menu-activo" href="carrito.html">
                🛒 Carrito
            </a>

        </nav>

    </header>


    <main class="contenido-principal">

        <section class="productos-carrito">

            <article>

                <img src="recursos/img/vela-canasta.jpg"
                     alt="Vela canasta">

                <div class="info-producto">

                    <h3>Vela canasta</h3>

                    <p>Precio: $2.500</p>

                    <p>Cantidad: 1</p>

                </div>

                <button class="eliminar">
                    Eliminar
                </button>

            </article>


            <article>

                <img src="recursos/img/vela-loto.jpg"
                     alt="Vela flor de loto">

                <div class="info-producto">

                    <h3>Vela flor de loto</h3>

                    <p>Precio: $3.000</p>

                    <p>Cantidad: 1</p>

                </div>

                <button class="eliminar">
                    Eliminar
                </button>

            </article>


            <article>

                <img src="recursos/img/bandeja-circular.jpg"
                     alt="Bandeja circular blanca">

                <div class="info-producto">

                    <h3>Bandeja circular</h3>

                    <p>Precio: $5.000</p>

                    <p>Cantidad: 1</p>

                </div>

                <button class="eliminar">
                    Eliminar
                </button>

            </article>


            <article>

                <img src="recursos/img/bandeja-lisa.jpg"
                     alt="Bandeja lisa blanca">

                <div class="info-producto">

                    <h3>Bandeja lisa</h3>

                    <p>Precio: $4.000</p>

                    <p>Cantidad: 1</p>

                </div>

                <button class="eliminar">
                    Eliminar
                </button>

            </article>

        </section>


        <p class="total-carrito">
            Total: $14.500
        </p>


        <div class="acciones-carrito">

            <button>
                Cancelar
            </button>

            <button>
                Confirmar compra
            </button>

        </div>

    </main>


    <footer class="pie-pagina">

        <p>Planta tu sueño - Productos artesanales</p>

    </footer>

</body>

</html>
